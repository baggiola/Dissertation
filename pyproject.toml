[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainer"
version = "0.1.0"
description = "Haptic and speech driven physical activity trainer"
authors = [{ name = "Benjamin Licata" }]
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=1.1",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyttsx3>=2.90",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
